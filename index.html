<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durak Arena</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <header class="top-bar">
      <div class="profile">
        <div class="avatar">🦊</div>
        <div>
          <b>Фокс</b>
          <small>#QR12657R</small>
        </div>
      </div>

      <div class="currency">
        <span>🪙 417 666</span>
        <span>💎 850</span>
      </div>
    </header>

    <section class="hero">

      <div class="logo">
        <div class="cards">♠ ♥ ♣ ♦</div>
        <h1>DURAK</h1>
        <h2>ARENA</h2>
      </div>

      <button class="play-button" id="playButton">
        ГРАТИ
      </button>

    </section>

    <section class="quick-menu">
      <button>🎁<span>Подарунки</span></button>
      <button>📋<span>Завдання</span></button>
      <button>⚙️<span>Налаштування</span></button>
      <button>🛒<span>Магазин</span></button>
      <button>👥<span>Клан</span></button>
      <button>🏅<span>Медалі</span></button>
    </section>

    <section class="stats">
      <div>
        <b>1250</b>
        <span>🏆 Рейтинг</span>
      </div>

      <div>
        <b>Сезон №4</b>
        <span>👑 Профі</span>
      </div>

      <div>
        <b>Лідери</b>
        <span>🥇 Рейтинг</span>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="active">🏠<span>Головна</span></button>
      <button>🃏<span>Гра</span></button>
      <button>⚔️<span>Рейтинг</span></button>
      <button>👤<span>Профіль</span></button>
      <button>🏆<span>Досягнення</span></button>
    </nav>

  </main>

  <script src="script.js"></script>
</body>
</html>
