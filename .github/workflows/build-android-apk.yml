name: Build Durak Arena APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Prepare DurakArena.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DurakArena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DurakArena
          path: DurakArena.apk
          if-no-files-found: error
          retention-days: 30
