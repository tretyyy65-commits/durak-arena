name: Build Durak Arena APK

# Build verification marker: UI redesign isolated branch
on:
  push:
    branches: [ main, ui-redesign-v2 ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent Android debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.DURAK_ARENA_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing DURAK_ARENA_DEBUG_KEYSTORE_B64 secret"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify Firebase signing SHA-1
        run: |
          EXPECTED="51:6E:60:D3:5C:F6:E8:FC:34:AB:87:59:33:4E:B5:06:73:BB:3E:4C"
          ACTUAL=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey 2>/dev/null | awk '/SHA1:/{print $2; exit}')
          echo "Android signing SHA-1: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing key does not match Firebase OAuth SHA-1."
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle clean testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare DurakArena.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DurakArena.apk

      - name: Verify APK signature matches Firebase
        run: |
          EXPECTED="51:6E:60:D3:5C:F6:E8:FC:34:AB:87:59:33:4E:B5:06:73:BB:3E:4C"
          ACTUAL=$(keytool -printcert -jarfile DurakArena.apk | awk '/SHA1:/{print $2; exit}')
          echo "APK signing SHA-1: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Built APK is signed with the wrong certificate."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DurakArena-${{ github.ref_name }}
          path: DurakArena.apk
          if-no-files-found: error
          retention-days: 30
